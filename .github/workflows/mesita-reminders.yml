name: Recordatorio de Mesita por WhatsApp

on:
  # Pausado: la cuenta de WhatsApp Business todavía no está habilitada por
  # Meta. Se dejó el código listo (ver scripts/mesita-reminders/send.mjs) y
  # el disparo diario pasó a mesita-reminders-email.yml mientras tanto.
  # Reactivar el "schedule" de acá cuando Meta habilite la cuenta.
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: scripts/mesita-reminders
        run: npm install

      - name: Enviar recordatorios
        working-directory: scripts/mesita-reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: node send.mjs
